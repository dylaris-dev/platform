syntax = "proto3";
package dylaris.node;
option go_package = "dylaris-proto/node";

// Node connects outbound to Core and registers itself.
// After that, file requests (Core→Node) and responses (Node→Core)
// flow over the same bidirectional stream.
service NodeService {
  rpc NodeConnect(stream NodeMessage) returns (stream NodeMessage);
}

// Envelope for all messages over the stream.
message NodeMessage {
  string request_id = 1;
  string server_uuid = 2;

  oneof payload {
    // Auth (Node→Core, first message after Connect)
    NodeAuth          auth          = 10;
    AuthResult        auth_result   = 11;

    // Reconnect challenge-response (Core->Node nonce, Node->Core HMAC of it)
    NodeChallenge         challenge          = 12;
    NodeChallengeResponse challenge_response = 13;

    // File Listing
    ListFilesReq      list_req      = 20;
    ListFilesResp     list_resp     = 21;

    // File Read (Core→Node request, Node→Core chunks+done)
    ReadFileReq       read_req      = 30;

    // File Write/Save (Core→Node request+chunks+done, Node→Core result)
    WriteFileReq      write_req     = 40;

    // File Upload (Core→Node: multipart data via chunks)
    UploadFileReq     upload_req    = 45;

    // Selective Read (download selected files/folders as zip)
    SelectiveReadReq  selective_read_req = 31;

    // File Create / Delete / Rename / Copy
    CreateFileReq     create_req    = 50;
    DeleteFileReq     delete_req    = 51;
    RenameFileReq     rename_req    = 52;
    CopyFileReq       copy_req      = 53;

    // Chunked Data (bidirectional, 64KB per chunk)
    DataChunk         chunk         = 60;
    TransferDone      transfer_done = 61;

    // Orphan inspection (Core→Node request, Node→Core response)
    InspectOrphanReq  inspect_orphan_req  = 92;
    InspectOrphanResp inspect_orphan_resp = 93;

    // Node-local backup ops (server_uuid is carried in NodeMessage.server_uuid).
    // Used when backup.mode == "node-local" — the .tar.gz archives live inside
    // each server's <server-dir>/.dylaris-backups/ folder on the Node's disk.
    BackupListReq     backup_list_req     = 100;
    BackupListResp    backup_list_resp    = 101;
    BackupOpenReq     backup_open_req     = 102;   // streaming read of one archive
    BackupDeleteReq   backup_delete_req   = 103;
    BackupUsageReq    backup_usage_req    = 104;
    BackupUsageResp   backup_usage_resp   = 105;

    // RCON exec (Phase 9): Core→Node request, Node→Core response.
    // server_uuid in NodeMessage.server_uuid identifies which container.
    // Node opens TCP to the container's mapped RCON port, auths with the
    // stored password, sends the command, returns whatever the server
    // wrote back. One request per command — no streaming.
    RconExecReq       rcon_exec_req       = 110;
    RconExecResp      rcon_exec_resp      = 111;

    // Custom-tab reverse proxy (WS5). Core->Node request + Node->Core streamed
    // response over the same bidi stream, request_id-correlated. HTTP request
    // body is inlined in HttpProxyReq.body (Core caps it); the HTTP response
    // rides HttpProxyRespHead + DataChunk(60) + TransferDone(61). WebSocket is
    // WsOpen (Core->Node) then WsFrame/WsClose in both directions.
    HttpProxyReq      http_proxy_req       = 112;
    HttpProxyRespHead http_proxy_resp_head = 113;
    WsOpen            ws_open              = 114;
    WsFrame           ws_frame             = 115;
    WsClose           ws_close             = 116;

    // File hashing (WS: version migration). Core->Node request naming files in
    // one directory, Node->Core response with sha1+sha512 per file. Used to
    // identify jars that were placed by hand (SFTP/beam) and therefore have no
    // database row saying which Modrinth project they are.
    HashFilesReq      hash_files_req      = 117;
    HashFilesResp     hash_files_resp     = 118;

    // Generic result / error
    OpResult          result        = 90;
    OpError           error         = 91;
  }
}

// ─── Auth ────────────────────────────────────────────────────────────
message NodeAuth {
  string node_token = 1;
  NodeIPs ips = 2;
  // Per-node Redis-ACL bootstrap fields (Redis ACL is mandatory; always set):
  string enroll_token = 3;   // first enrollment only
  string secret_proof = 4;   // HMAC proof of possession on later connects
  bool   acl_supported = 5;  // node advertises it can use scoped creds
  // Proof the caller holds CLUSTER_SECRET (HMAC over the node token). Required
  // before Core hands a known node its per-node secret for the first time.
  string cluster_proof = 6;
  // The release this node image was built from ("2026.08.28"), or empty when the
  // build carries no stamp. Sent at AUTH rather than only in the heartbeat
  // because a mandatory-update deadline has to be answerable at connect time,
  // and a heartbeat is both later and expirable.
  //
  // NEVER treated as a credential: it is self-reported and only ever makes Core
  // refuse or warn, never admit. Empty means UNKNOWN and is always admitted -
  // every image built before stamping sends nothing, and refusing those would
  // lock out the installed base on the day it ships.
  string release_version = 7;
  // What this machine SAYS it is. Sent so an operator can recognise a node that
  // is being refused - the panel lists rejected join attempts, and "some
  // identity from some address" is not enough to decide whether to let it back
  // in.
  //
  // Self-reported and NEVER used for anything but display. It arrives before
  // any proof is checked, so treating it as fact would let anyone who can reach
  // the port write into the panel. The one field on that screen that cannot be
  // forged is the observed source address, which Core reads from the connection
  // rather than from here.
  //
  // The real machine's name needs help on Swarm: os.Hostname() inside a task is
  // the task name, so the node reads NODE_HOSTNAME, which the compose file
  // templates from {{.Node.Hostname}}.
  NodeIdentity identity = 8;
}

// NodeIdentity is the self-reported description of a machine, for humans.
// Nothing here is trusted; see the comment on NodeAuth.identity.
message NodeIdentity {
  string hostname = 1;
  // Physical cores as the node counts them, and the model string from the OS.
  int32  cpu_cores = 2;
  string cpu_model = 3;
  // Total memory in bytes.
  int64  memory_bytes = 4;
}

message AuthResult {
  bool ok = 1;
  string core_id = 2;
  string message = 3;
  // Per-node Redis-ACL bootstrap response (Redis ACL is mandatory).
  // Deprecated: advisory only. Core always provisions the node's ACL and no longer
  // gates on this field; kept physically to avoid a protoc regen. (No .pb.go regen in TP2f.)
  bool   acl_enabled = 4;
  string node_secret = 5;   // hex per-node secret (returned once on first issue / enroll)
  // Core-minted, unguessable node identity. Set ONLY on the enroll (first-issuance)
  // response; the node persists it and uses it as its token on every later connect.
  // Empty on reconnect. (field 6 was the removed redis_addr.)
  string assigned_id = 6;
  // Per-node Link sidecar tunnel credentials, delivered on every ACL auth so a
  // secret-free node can spawn + run its Link sidecar without holding CLUSTER_SECRET.
  // Set on every successful bootstrap/enroll or reconnect auth. Derived by Core
  // from CLUSTER_SECRET; validated by the Hub.
  string link_secret = 7;           // = DeriveLinkToken(assigned_id, CLUSTER_SECRET)
  string link_discovery_proof = 8;  // = DeriveDiscoveryProof(assigned_id, CLUSTER_SECRET)
  // A mandatory update this node is subject to but has not applied. Set on a
  // SUCCESSFUL auth: the node is admitted and logs this loudly until it updates.
  // Empty when nothing is pending.
  //
  // When the deadline has passed the node is refused instead, with the reason in
  // `message` - so the operator reads why rather than watching a connection fail
  // for no stated cause.
  string update_required = 9;        // human-readable warning, empty when none
  string update_required_version = 10;  // the release the node must reach
  string update_required_deadline = 11; // RFC3339, empty when immediate
  // The Redis address this node should use: Core's own configured REDIS_ADDR,
  // verbatim and never resolved to an IP, because the node and its containers
  // sit on the same overlay as Core and a resolved address could belong to a
  // network they are not on. Set on every successful auth.
  //
  // EMPTY MEANS "Core names none", never "nowhere": the node keeps the address
  // it already has. Core leaves it empty for an owned (BYON) node, which reaches
  // Redis through its warp proxy. Field 12 because 6 is taken by assigned_id.
  string redis_addr = 12;
}

// Reconnect challenge: Core issues a fresh single-use nonce; the node returns
// HMAC-SHA256(per-node-secret, "dylaris-redis-acl:v1:challenge:"+nonce).
message NodeChallenge {
  string nonce = 1;
}

message NodeChallengeResponse {
  string response = 1;
}

message NodeIPs {
  string public = 1;
  repeated string private = 2;
}

// ─── File Operations ─────────────────────────────────────────────────
message ListFilesReq {
  string path = 1;
}

message ListFilesResp {
  repeated FileInfo files = 1;
}

message FileInfo {
  string name = 1;
  bool is_dir = 2;
  int64 size = 3;
}

// Hash named files inside one directory of a server. Names are plain file
// names, never paths: the node rejects anything else rather than resolving it.
message HashFilesReq {
  string path = 1;             // directory relative to the sub-server root, e.g. "mods"
  repeated string names = 2;   // plain file names inside that directory
}

message FileHash {
  string name   = 1;
  string sha1   = 2;
  string sha512 = 3;
  int64  size   = 4;
  string error  = 5;   // set when this one file could not be hashed
}

message HashFilesResp {
  repeated FileHash files = 1;
}

message ReadFileReq {
  string path = 1;
  bool zip_if_dir = 2;
}

// Selective download: zip only selected paths within a base directory.
// Reusable for backups (same selection mechanism).
message SelectiveReadReq {
  string base_path = 1;             // e.g. "" (server root) or "plugins/"
  repeated string selected = 2;     // e.g. ["WorldEdit/", "config.yml"]
  bool select_all = 3;              // if true, ignore selected list and zip everything
}

message WriteFileReq {
  string path = 1;
  int64 total_size = 2;
}

message UploadFileReq {
  string path = 1;
  string filename = 2;
  int64 total_size = 3;
  string strategy = 4;           // "replace", "merge", etc.
  string merge_conflict = 5;     // "replace", "ignore"
}

message CreateFileReq {
  string path = 1;
  bool is_dir = 2;
}

message DeleteFileReq {
  string path = 1;
}

message RenameFileReq {
  string old_path = 1;
  string new_name = 2;
}

message CopyFileReq {
  string src_path = 1;
  string dst_path = 2;
}

// ─── Chunked Transfer ────────────────────────────────────────────────
message DataChunk {
  bytes data = 1;       // max 64KB
  int64 offset = 2;
}

message TransferDone {
  int64 total_bytes = 1;
  string filename = 2;  // Optional: filename for downloads
}

// ─── Orphan Inspection ───────────────────────────────────────────────
// Read-only: returns .dylaris.json metadata, .active_server content, and
// a directory scan of sub-servers. No mutation is performed.
message InspectOrphanReq {}  // server_uuid carried in NodeMessage.server_uuid

message SubServerInfo {
  string name = 1;
  string type = 2;
}

message InspectOrphanResp {
  bool   has_metadata      = 1;   // false → .dylaris.json absent or unparseable
  string metadata_json     = 2;   // raw JSON of .dylaris.json (only when has_metadata=true)
  string active_sub_server = 3;   // content of .active_server, or "" if absent
  repeated SubServerInfo sub_servers = 4;
}

// ─── Node-local backups ──────────────────────────────────────────────
message BackupListReq {}  // server_uuid in NodeMessage.server_uuid

message BackupObject {
  string key  = 1;   // archive filename (e.g. "20260524-141200.tar.gz")
  int64  size = 2;
  int64  modified_unix = 3;
}

message BackupListResp {
  repeated BackupObject objects = 1;
}

message BackupOpenReq {
  string key = 1;   // filename within .dylaris-backups/
}

message BackupDeleteReq {
  string key = 1;
}

message BackupUsageReq {}  // server_uuid in NodeMessage.server_uuid

message BackupUsageResp {
  int64 used_bytes = 1;
  int32 count      = 2;
}

// ─── Results ─────────────────────────────────────────────────────────
message OpResult {
  string message = 1;
}

message OpError {
  int32 code = 1;
  string message = 2;
}

// ─── RCON (Phase 9) ──────────────────────────────────────────────────
// Node owns the container, knows its mapped RCON host:port (or container
// name on the dylaris_net overlay) and the rcon_password the Core passes
// here. Stateless per call — no connection pooling V1.
message RconExecReq {
  string command          = 1;
  string rcon_password    = 2;
  int32  rcon_port        = 3;   // 0 → use container's mapped 25575
  int32  timeout_ms       = 4;   // 0 → defaults to 3000
}

message RconExecResp {
  bool   ok               = 1;
  string output           = 2;
  string error            = 3;
  int64  duration_ms      = 4;
}

// --- Custom-tab reverse proxy (WS5) ---
// request_id + server_uuid are carried by the NodeMessage envelope, not
// repeated here (same convention as RconExecReq).
message HttpHeader {
  string key   = 1;
  string value = 2;
}

message HttpProxyReq {
  int32  target_port = 1;   // container port, 1..65535
  string method      = 2;   // GET, POST, ...
  string path        = 3;   // target_path + forwarded sub-path, incl. ?query
  repeated HttpHeader headers = 4;
  bytes  body        = 5;   // inline request body, empty for GET (Core caps size)
}

message HttpProxyRespHead {
  int32  status_code = 1;
  repeated HttpHeader headers = 2;
}

message WsOpen {
  int32  target_port = 1;
  string path        = 2;   // incl. ?query
  repeated HttpHeader headers = 3;
}

message WsFrame {
  int32 opcode = 1;   // gorilla messageType: 1=text, 2=binary
  bytes data   = 2;
  bool  fin    = 3;   // last fragment of one application message
}

message WsClose {
  int32  code   = 1;
  string reason = 2;
}
