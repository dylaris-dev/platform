# ─────────────────────────────────────────────────────────────────────────────
# DYLARIS — DOCKER SWARM deployment (PRODUCTION)
#
# A multi-host fleet on an overlay network, with `deploy:` blocks
# (replicas, placement, restart policy, resources).
#
# PRODUCTION posture: Postgres and Redis are MANAGED/EXTERNAL - the bundled
# timescaledb + redis services are commented out below. Set DB_HOST/DB_PORT/
# DB_SSLMODE and REDIS_ADDR to your managed endpoints (see .env). To run a
# bundled DB/Redis for a small single-region deploy, uncomment those services
# (each carries its own re-enable checklist) and pin the DB host with the
# `docker node update --label-add dylaris.db=true <node>` step shown there.
#
#   docker swarm init                                            # once, on the manager
#   set -a; . ./.env; set +a                                     # load env into the shell
#   docker stack deploy -c docker-stack.yml dylaris
#
#   docker stack services dylaris
#   docker service logs -f dylaris_core
#
# Join more hosts as Nodes:  `docker swarm join-token worker`  → run the printed
# command on each host. The `node` service is GLOBAL, so every host becomes a
# Node automatically (NODE_ID templated from the hostname).
#
# For a single machine, use docker-compose.yml instead.
# ─────────────────────────────────────────────────────────────────────────────

services:
  core:
    image: ghcr.io/dylaris-dev/platform-core:latest
    environment:
      API_PORT: "25500"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:25500}"
      # EMPTY for every normal deployment: Core serves the panel, so the API is
      # same-origin and the panel finds it without being told. Set it only if
      # you terminate the API on a second hostname, and only for non-browser
      # callers - the session cookie is host-only and does not cross that split.
      # Core renders this into the page config AND the CSP's connect-src.
      PANEL_API_URL: "${PANEL_API_URL:-}"
      JWT_SECRET: "${JWT_SECRET}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      # The gateway Hub's internal URL, so the panel's DNS form can be forwarded
      # to it. Core stores no DNS credential itself - the Hub owns that row and
      # is the only writer of records. Empty = no gateway, and the panel says so.
      GATEWAY_HUB_URL: "${GATEWAY_HUB_URL:-}"
      DYLARIS_REGION: "${DYLARIS_REGION:-default}"
      # PRODUCTION default = managed/external Postgres and Redis (the bundled
      # timescaledb + redis services below are commented out). Point DB_HOST /
      # REDIS_ADDR at your managed endpoints. If you re-enable the bundled
      # services, the "${VAR:-<service>}" fallbacks resolve to them unchanged.
      DB_HOST: "${DB_HOST:-timescaledb}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      # "disable" suits the bundled in-swarm DB; set "require"/"verify-full" for a
      # managed Postgres reached over an untrusted network.
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      # Core admin Redis login. Empty against the bundled passwordless dev Valkey;
      # for a password-protected or external Redis set both. REDIS_PASSWORD supports
      # the _FILE secret convention (REDIS_PASSWORD_FILE=...). Scoped per-node users
      # are always Core-provisioned, never hand-set.
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      # Custom-tab reverse proxy. OFF by default: with no suffix there is no
      # host to serve a container on, so proxied tabs and share links are
      # unavailable and direct tabs are unaffected.
      #
      # Each proxied tab is served at the ROOT of "<label>.<suffix>". That is
      # what makes BlueMap and Dynmap work - both request "/js/..." from the
      # origin root and cannot run under a path prefix - and it puts a tenant's
      # container on an origin that is not the panel's, where its scripts cannot
      # reach the session token.
      #
      # Needs a wildcard DNS record for *.<suffix> pointing at Core, and a
      # certificate covering BOTH <suffix> and *.<suffix> (a wildcard does not
      # cover its own parent). Wildcards are DNS-01 only.
      TAB_PROXY_HOST_SUFFIX: "${TAB_PROXY_HOST_SUFFIX:-}"
      # Everything below is forwarded ONLY so that setting it in the stack
      # environment (or a shell-sourced .env) actually works. A documented
      # variable that is missing from this block is silently ignored no matter
      # what the operator sets.
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      # Must be flipped on Core AND every Node together, or the mesh breaks.
      GRPC_TLS_ENABLED: "${GRPC_TLS_ENABLED:-true}"
      DB_TYPE: "${DB_TYPE:-timescaledb}"
      # NO metrics database variable. Where the long-term statistics are
      # written is set in the panel under Settings, Features - it is stored in
      # the database, so it survives a redeploy and there is only one place that
      # can answer it.
      EXTERNAL_TICKET_DB_URL: "${EXTERNAL_TICKET_DB_URL:-}"
      BILLING_SUSPEND_GRACE: "${BILLING_SUSPEND_GRACE:-48h}"
      # DNS updater (owner/SaaS, off by default). Present here so a value put in
      # .env actually reaches the container - a .env file is only read to expand
      # ${VAR} while this YAML is parsed, it is never injected on its own. All of
      # these can be set in Settings -> Infrastructure -> DNS instead, where the
      # token is stored encrypted; the environment wins per field when both exist.
      DNS_UPDATER_ENABLED: "${DNS_UPDATER_ENABLED:-false}"
      DNS_PROVIDER: "${DNS_PROVIDER:-cloudflare}"
      DNS_API_TOKEN: "${DNS_API_TOKEN:-}"
      DNS_ZONE: "${DNS_ZONE:-}"
      DNS_ZONES: "${DNS_ZONES:-}"

      # SaaS-only store integration. Documented in .env.example since it shipped,
      # but never listed here - so setting it in .env did nothing at all and Core
      # kept booting with the store surface off. Exactly the trap the comment
      # above describes. Both unset = self-host / open-core build, unchanged.
      STORE_URL: "${STORE_URL:-}"
      STORE_SHARED_KEY: "${STORE_SHARED_KEY:-}"

      # Documented in the README as configurable, but previously not listed here,
      # so a .env value never reached Core.
      #
      # WATCH THE DEFAULTS. Core reads these with os.LookupEnv, which returns a
      # SET-BUT-EMPTY value rather than falling through - so writing "${X:-}" for
      # a var that has a non-empty default in config.go OVERRIDES that default
      # with "". That is why the two below repeat their code defaults literally
      # instead of being empty; keep them in sync with core/config/config.go.
      DYLARIS_GRPC_PORT: "${DYLARIS_GRPC_PORT:-25501}"
      REDIS_DB: "${REDIS_DB:-0}"
      # These default to "" in code, so an empty value is a no-op.
      DYLARIS_CORE_ID: "${DYLARIS_CORE_ID:-}"
      CLAMAV_ADDR: "${CLAMAV_ADDR:-}"
      # Name Core answers to on this network. Only needed if the service is not
      # called "core"; it is what the BYON deploy snippet resolves for
      # CORE_GRPC_ADDR, so a wrong value shows up as an unfillable snippet.
      CORE_SERVICE_NAME: "${CORE_SERVICE_NAME:-}"
      # UPDATES_URL_PLATFORM and UPDATES_URL_HOSTED are deliberately NOT listed.
      # Their code defaults are the public raw release-notes URLs, and setting
      # either to "" is the supported way to fall back to the copy EMBEDDED in
      # the image - which is what an air-gapped install wants, and which listing
      # them here with any shell default would take away.
      # Set them directly on the service if you need to point them elsewhere.
      #
      # RELEASE_ENFORCE_MIN_VERSION is likewise unlisted. It defaults to on, and
      # "false" is the break-glass that stops Core refusing nodes which missed a
      # mandatory-update deadline. Set it on the service, deliberately.
    # Core's shutdown runs a sequence, and the whole of it has to fit inside
    # this window or the later steps simply never execute. Budget: the API
    # listener drains for up to 30s, the tab-proxy listener for up to another
    # 30s, node gRPC streams for up to 10s, and only then does Core cancel its
    # background loops, DELETE its heartbeat key and RELEASE the leader lease.
    # Docker's default is 10s, which cut it off before the first step finished:
    # the heartbeat and the lease were then left to expire on their own 30s
    # TTLs on every single deploy, which is exactly what deleting them early
    # was meant to avoid.
    #
    # Draining the API listener really does take the full 30s whenever a panel
    # tab is open: Shutdown waits for active connections and an SSE stream on
    # /api/system/events stays active until its client goes away. Expect a
    # rolling deploy to hold the outgoing task for that long. With start-first
    # the replacement is already serving, so this is a lingering task, not
    # downtime.
    stop_grace_period: 90s
    ports:
      - "25500:25500"   # REST API
      - "25501:25501"   # gRPC node mesh (Cluster-Sync)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:25500/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dylaris_net
    volumes:
      # Core writes library, ticket-attachments, ticket-backups here. Without a
      # volume this data is lost on container recreation. NOTE: this is a LOCAL
      # per-host volume, and this stack runs "replicas: 2" below - so the two
      # Cores do NOT share it. That is why the "Core File Storage" setting in
      # the panel must be pointed at S3, or at a shared filesystem mounted on
      # every host (see the commented block below). The filesystem backend IS
      # allowed across multiple Cores - but only if the same filesystem is
      # genuinely mounted at that path on every host. Core now PROVES this
      # with a reachability check (every online Core must write + read +
      # cross-write) before saving the config, rather than assuming it from a
      # Core count. See "Core file storage across multiple Cores" in the
      # README for the failure modes and the fleet-health surface.
      - core_data:/app/dylaris_data

      # ── Optional: a shared filesystem instead of S3 ──────────────────────
      # Mount the share on EVERY swarm host at the same path, then bind-mount
      # it in here and point the panel's "Core File Storage" -> Filesystem
      # Path at the container-side path (/mnt/dylaris-shared).
      #
      # - type: bind
      #   source: /mnt/dylaris-shared
      #   target: /mnt/dylaris-shared
      #   bind:
      #     propagation: rslave
      #
      # Why "rslave": Docker's bind propagation defaults to rprivate, so a
      # share mounted on the host AFTER the container started stays invisible
      # inside it - Core would then write into the container's own filesystem
      # and lose everything on recreation. rslave lets host mounts appearing
      # under this path propagate in. It requires the host mountpoint to
      # already be shared; verify with:
      #     findmnt -o TARGET,PROPAGATION /mnt/dylaris-shared
      # Mount propagation does not work with Docker Desktop.
      #
      # OWNERSHIP - the step that is easiest to miss. Core runs as uid 1000
      # (the non-root "dylaris" user, see Dockerfile), so this path must be
      # writable by uid 1000 on EVERY host. Get it wrong and the reachability
      # check refuses the config with "write-denied" on every Core, which is
      # loud and actionable but only after you tried to save. Two ways:
      #   - own the share as 1000, which is what the fstab lines below do, or
      #   - leave the mount root as it is and point the panel at a
      #     subdirectory you created once:
      #       mkdir -p /mnt/dylaris-shared/dylaris
      #       chown 1000:1000 /mnt/dylaris-shared/dylaris
      #     Core's own mkdir then creates everything below it as uid 1000.
      # S3 has no uid semantics and sidesteps this entirely.
      #
      # /etc/fstab on each host:
      #
      #   NFS (recommended):
      #     nas:/export/dylaris  /mnt/dylaris-shared  nfs  defaults,_netdev  0 0
      #
      #     NFS carries the server's own uid/gid over the wire, so the EXPORTED
      #     directory must be owned by 1000 (chown 1000:1000 on the NAS), or the
      #     export must squash to it (anonuid=1000,anongid=1000,all_squash).
      #     There is no client-side mount option that fixes this for NFS.
      #
      #     Leave the default "hard" retry behaviour in place. nfs(5) states
      #     that "soft" can cause SILENT DATA CORRUPTION and should only be
      #     used "when client responsiveness is more important than data
      #     integrity" - which is the wrong trade for a file store. Core does
      #     not need "soft" to stay responsive: it runs its own watchdog and
      #     circuit breaker over this path, fails storage requests fast while
      #     the mount is unreachable, and caps concurrent filesystem calls, so
      #     an unreachable NAS degrades Core rather than hanging it. Processes
      #     blocked on a "hard" mount are also killable on any kernel since
      #     2.6.25 (the "intr" option is ignored since then - do not add it).
      #     If the application must be able to tell a timeout from a generic
      #     I/O error, "softerr" returns ETIMEDOUT instead of EIO, but it
      #     carries the same corruption caveat as "soft".
      #
      #   SMB/CIFS:
      #     //nas/dylaris  /mnt/dylaris-shared  cifs  credentials=/etc/dylaris-smb.cred,uid=1000,gid=1000,_netdev  0 0
      #
      #     uid/gid here are a CLIENT-side ownership override: SMB carries no
      #     unix uids, so the mount presents every file as that owner. It must
      #     be 1000, not 0, or Core cannot write the share at all.
      #
      #     Note the inversion: CIFS defaults to "soft" (return an error),
      #     the opposite of NFS's "hard" default. Leave it. Add "hard" only if
      #     you specifically want operations to block until the server is back.
      #     Detection of an unresponsive server is driven by echo_interval
      #     (default 60s; reconnect is attempted at 3x that value).
    deploy:
      # Multiple replicas are safe: Redis leader-election keeps singleton jobs
      # (discovery, Warp resync) on one replica; all replicas serve the API.
      replicas: 2
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
      resources:
        limits:
          memory: 512M

  node:
    image: ghcr.io/dylaris-dev/platform-node:latest
    environment:
      # Templated per host → every swarm host is a distinct Node.
      NODE_ID: "{{.Node.Hostname}}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      NODE_TAGS: "${NODE_TAGS:-}"
      NODE_REGION: "${NODE_REGION:-}"
      # Managed/external Redis by default (bundled redis service commented out).
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      # Redis-ACL bootstrap (mandatory -- no open-Redis fallback). CORE_GRPC_ADDR
      # is Core's gRPC mesh port on the same Docker network (DYLARIS_GRPC_PORT,
      # default 25501). NODE_ENROLL_TOKEN is the single-use first-boot token,
      # generated in the panel; a node with an already-cached secret starts
      # without it.
      #
      # There is no NODE_RECOVERY_TOKEN any more. A node whose secret and Core's
      # have diverged keeps dialling and appears under Settings -> Nodes ->
      # Connection attempts, where an operator admits it. That is the whole
      # reason it went: re-admitting one host used to mean editing this file and
      # redeploying the stack.
      CORE_GRPC_ADDR: "core:25501"
      NODE_ENROLL_TOKEN: "${NODE_ENROLL_TOKEN:-}"
      # The HOST's name, not the task's. Inside a Swarm task os.Hostname() is the
      # container id, which is useless for recognising a machine in the panel;
      # Swarm templates the real one here. It templates the hostname but NOT the
      # address, which is why only this is passed.
      NODE_HOSTNAME: "{{.Node.Hostname}}"
      PORT_RANGE: "${PORT_RANGE:-25600-25699}"
      # Comma-separated hosts the Node may download Core-minted pack mrpacks
      # from, e.g. app.example.com
      MODPACK_MIRROR_HOSTS: "${MODPACK_MIRROR_HOSTS:-}"
      # Beam ticket secret. The node validates beam tickets Core signed with
      # JWT_SECRET (node/main.go StartBeamServer). Required even in this Swarm
      # topology, where transfers arrive via the gateway beam-relay over the
      # overlay (25523 stays UNPUBLISHED, see below). Empty = all beam transfers
      # rejected. Must equal Core's JWT_SECRET AND the gateway relay's BEAM_JWT_SECRET.
      BEAM_JWT_SECRET: "${JWT_SECRET}"
      # Same reason as the core block above: forwarded so the stack environment
      # actually reaches the container. SIDECAR_REDIS_ADDR matters most here -
      # MC containers are host siblings and cannot resolve Swarm overlay DNS, so
      # in this topology they need Redis by IP, and until it was listed here the
      # documented "set it to the leader's private IP in Swarm" was impossible
      # without editing this file. GRPC_TLS_ENABLED must match Core's setting.
      SIDECAR_REDIS_ADDR: "${SIDECAR_REDIS_ADDR:-}"
      SIDECAR_REDIS_DB: "${SIDECAR_REDIS_DB:-}"
      GRPC_TLS_ENABLED: "${GRPC_TLS_ENABLED:-true}"
      GRPC_TLS_FINGERPRINT: "${GRPC_TLS_FINGERPRINT:-}"
      NODE_EXTERNAL: "${NODE_EXTERNAL:-}"
      STORAGE_PATHS: "${STORAGE_PATHS:-}"
      DYLARIS_CPUSET_CPUS: "${DYLARIS_CPUSET_CPUS:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dylaris_data:/app/dylaris_data
    networks:
      - dylaris_net
    # Beam's direct-connect port (25523) is deliberately NOT published here: in the
    # SaaS/Swarm topology the relay reaches the node over the overlay and publishing
    # 25523 would expose the node IP and defeat IP-hiding. Direct connect is a
    # self-host-only path (see docker-compose.yml). The plain :25521 is never
    # published either.
    deploy:
      # One Node task per swarm host.
      mode: global
      restart_policy:
        condition: any
    # NOTE: external/home (Warp) nodes are deployed separately with a
    # `node.labels.dylaris_role == external` constraint + `NODE_EXTERNAL=true`.
    # See NODE_EXTERNAL / NODE_TAGS in README.md's Configuration reference.

  # timescaledb:
  #   image: timescale/timescaledb:latest-pg16
  #   environment:
  #     POSTGRES_USER: "${DB_USER}"
  #     POSTGRES_PASSWORD: "${DB_PASSWORD}"
  #     POSTGRES_DB: "${DB_NAME}"
  #   volumes:
  #     - timescaledb_data:/var/lib/postgresql/data
  #   networks:
  #     - dylaris_net
  #   deploy:
  #     replicas: 1
  #     placement:
  #       constraints: [node.labels.dylaris.db == true]
  #     restart_policy:
  #       condition: any

  # ── Bundled Redis (Valkey) — DISABLED for production ────────────────────────
  # Production defaults to a managed/external Redis (set REDIS_ADDR on core+node).
  # To run the bundled Valkey instead, UNCOMMENT this block, seed the aclfile
  # admin user once before the first deploy (see the command below), and leave
  # REDIS_ADDR unset so it falls back to "redis:6379". Redis ACL is mandatory:
  # STOCK image (non-root, drops to `valkey` via setpriv), --aclfile refuses to
  # start against a missing file, so create the admin `default` user ONCE with a
  # password equal to Core's REDIS_PASSWORD (no space - ACL fields are space-
  # delimited):
  #   mkdir -p /etc/dylaris/valkey-acl
  #   printf 'user default on >%s ~* &* +@all\n' "$REDIS_PASSWORD" > /etc/dylaris/valkey-acl/users.acl
  # Core connects as that `default` admin and provisions the per-node scoped users.
  # redis:
  #   image: valkey/valkey:8-alpine
  #   command: ["valkey-server", "--save", "", "--appendonly", "no", "--aclfile", "/data/users.acl"]
  #   volumes:
  #     - /etc/dylaris/valkey-acl:/data
  #   networks:
  #     - dylaris_net
  #   deploy:
  #     replicas: 1
  #     placement:
  #       constraints: [node.role == manager]
  #     restart_policy:
  #       condition: any

  # ───────────────────────────────────────────────────────────────────────
  # metricsdb - the long-term statistics store. COMMENTED OUT by default.
  #
  # Only needed for MINUTE resolution. Left unconfigured in the panel, the
  # recorder writes HOUR buckets into the Core database and this service is not
  # used at all, which is the supported default and what a self-hoster runs.
  #
  # Why a separate database rather than the Core one: the Core Postgres here is
  # Supabase's, where the platform user is not superuser and cannot install the
  # timescaledb extension. And minute resolution kept for years is a QUERY
  # problem before it is a storage one - a year is over half a million rows per
  # series, which only chunking and continuous aggregates make readable.
  #
  # To enable:
  #   1. uncomment this service and the metricsdb_data volume below
  #   2. put a password in .env for POSTGRES_PASSWORD here
  #   3. pin it to a host with room:
  #      docker node update --label-add dylaris.metricsdb=true <node>
  #   4. deploy, then in Settings -> Features enter this host, database, user
  #      and password and switch the statistics on. There is no environment
  #      variable for it: the target is stored in the database, so the panel is
  #      the only place that answers where recording goes.
  #
  # It is deliberately NOT published to the host. Only Core talks to it, over
  # the overlay network. And if it is down, Core does not care: the recorder
  # drops rather than queueing, and nothing else reads it.
  #
  # metricsdb:
  #   image: timescale/timescaledb:latest-pg16
  #   environment:
  #     POSTGRES_USER: dylaris
  #     POSTGRES_PASSWORD: "${METRICS_DB_PASSWORD:?set METRICS_DB_PASSWORD in .env}"
  #     POSTGRES_DB: dylaris_metrics
  #   volumes:
  #     - metricsdb_data:/var/lib/postgresql/data
  #   networks:
  #     - dylaris_net
  #   deploy:
  #     replicas: 1
  #     placement:
  #       constraints: [node.labels.dylaris.metricsdb == true]
  #     restart_policy:
  #       condition: any
  #     resources:
  #       limits:
  #         memory: 2G
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U dylaris -d dylaris_metrics"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5

volumes:
  # metricsdb_data:     # re-enable together with the metricsdb service above
  # timescaledb_data:   # re-enable together with the bundled timescaledb service
  dylaris_data:
  core_data:

networks:
  dylaris_net:
    driver: overlay
    attachable: true
