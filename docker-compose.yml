# ─────────────────────────────────────────────────────────────────────────────
# DYLARIS — SINGLE-HOST deployment
#
# Everything runs on ONE machine over a local bridge network.
# Best for a single VPS / homelab box.
#
#   cp .env.example .env   # then edit JWT_SECRET, CLUSTER_SECRET, DB_PASSWORD
#   docker compose up -d
#   open http://localhost:25500  →  /setup
#
# For a multi-host fleet, use docker-stack.yml (Docker Swarm) instead.
# ─────────────────────────────────────────────────────────────────────────────

services:
  core:
    image: ghcr.io/dylaris-dev/platform-core:latest
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      API_PORT: "25500"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:25500}"
      # EMPTY for every normal deployment: Core serves the panel, so the API is
      # same-origin and the panel finds it without being told. Set it only if
      # you terminate the API on a second hostname, and only for non-browser
      # callers - the session cookie is host-only and does not cross that split.
      # Core renders this into the page config AND the CSP's connect-src.
      PANEL_API_URL: "${PANEL_API_URL:-}"
      JWT_SECRET: "${JWT_SECRET}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      # The gateway Hub's internal URL, so the panel's DNS form can be forwarded
      # to it. Core stores no DNS credential itself - the Hub owns that row and
      # is the only writer of records. Empty = no gateway, and the panel says so.
      GATEWAY_HUB_URL: "${GATEWAY_HUB_URL:-}"
      DYLARIS_REGION: "${DYLARIS_REGION:-default}"
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      REDIS_ADDR: "redis:6379"
      # Core admin Redis login. Empty against the bundled passwordless dev Valkey;
      # for a password-protected or external Redis set both. REDIS_PASSWORD supports
      # the _FILE secret convention (REDIS_PASSWORD_FILE=...). Scoped per-node users
      # are always Core-provisioned, never hand-set.
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      # Custom-tab reverse proxy. OFF by default: with no suffix there is no
      # host to serve a container on, so proxied tabs and share links are
      # unavailable and direct tabs are unaffected.
      #
      # Each proxied tab is served at the ROOT of "<label>.<suffix>". That is
      # what makes BlueMap and Dynmap work - both request "/js/..." from the
      # origin root and cannot run under a path prefix - and it puts a tenant's
      # container on an origin that is not the panel's, where its scripts cannot
      # reach the session token.
      #
      # Three prerequisites, all outside this file - see .env.example and the
      # worked Traefik labels in /docs/reverse-proxy:
      #   - the suffix must be on the SAME registrable domain as FRONTEND_URL,
      #     because the tab ticket cookie is only readable same-site
      #   - DNS for BOTH <suffix> and *.<suffix>, grey-clouded behind Cloudflare
      #     (Universal SSL stops one level up and will not cover *.share.x)
      #   - a certificate covering BOTH names, which is DNS-01 only, and which
      #     the router has to ASK for by name rather than get per hostname
      TAB_PROXY_HOST_SUFFIX: "${TAB_PROXY_HOST_SUFFIX:-}"
      # Everything below is forwarded ONLY so that setting it in .env actually
      # works. Compose uses a .env file for ${...} substitution, it does NOT
      # inject it into the container, so a documented variable that is missing
      # from this block is silently ignored no matter what the operator sets.
      # Break-glass admin creation via /setup. RAM-only, never persisted.
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      # Which proxies' X-Forwarded-For Core believes, for rate limiting and the
      # audit log. Empty trusts the private ranges, which is right for the
      # reference reverse-proxy-on-the-same-Docker-network layout.
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      # Must be flipped on Core AND every Node together, or the mesh breaks.
      GRPC_TLS_ENABLED: "${GRPC_TLS_ENABLED:-true}"
      # timescaledb (hypertable + native retention) or postgres (plain table).
      DB_TYPE: "${DB_TYPE:-timescaledb}"
      # NO metrics database variable. Where the long-term statistics are
      # written is set in the panel under Settings, Features - it is stored in
      # the database, so it survives a redeploy and there is only one place that
      # can answer it.
      # Only relevant when pointing DB_HOST at an external Postgres.
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      EXTERNAL_TICKET_DB_URL: "${EXTERNAL_TICKET_DB_URL:-}"
      BILLING_SUSPEND_GRACE: "${BILLING_SUSPEND_GRACE:-48h}"
      # DNS updater (owner/SaaS, off by default). Present here so a value put in
      # .env actually reaches the container - a .env file is only read to expand
      # ${VAR} while this YAML is parsed, it is never injected on its own. All of
      # these can be set in Settings -> Infrastructure -> DNS instead, where the
      # token is stored encrypted; the environment wins per field when both exist.
      DNS_UPDATER_ENABLED: "${DNS_UPDATER_ENABLED:-false}"
      DNS_PROVIDER: "${DNS_PROVIDER:-cloudflare}"
      DNS_API_TOKEN: "${DNS_API_TOKEN:-}"
      DNS_ZONE: "${DNS_ZONE:-}"
      DNS_ZONES: "${DNS_ZONES:-}"

      # SaaS-only store integration. Documented in .env.example since it shipped,
      # but never listed here - so setting it in .env did nothing at all and Core
      # kept booting with the store surface off. Exactly the trap the comment
      # above describes. Both unset = self-host / open-core build, unchanged.
      STORE_URL: "${STORE_URL:-}"
      STORE_SHARED_KEY: "${STORE_SHARED_KEY:-}"

      # Documented in the README as configurable, but previously not listed here,
      # so a .env value never reached Core.
      #
      # WATCH THE DEFAULTS. Core reads these with os.LookupEnv, which returns a
      # SET-BUT-EMPTY value rather than falling through - so writing "${X:-}" for
      # a var that has a non-empty default in config.go OVERRIDES that default
      # with "". That is why the two below repeat their code defaults literally
      # instead of being empty; keep them in sync with core/config/config.go.
      DYLARIS_GRPC_PORT: "${DYLARIS_GRPC_PORT:-25501}"
      REDIS_DB: "${REDIS_DB:-0}"
      # These default to "" in code, so an empty value is a no-op.
      DYLARIS_CORE_ID: "${DYLARIS_CORE_ID:-}"
      CLAMAV_ADDR: "${CLAMAV_ADDR:-}"
      # Name Core answers to on this network. Only needed if the service is not
      # called "core"; it is what the BYON deploy snippet resolves for
      # CORE_GRPC_ADDR, so a wrong value shows up as an unfillable snippet.
      CORE_SERVICE_NAME: "${CORE_SERVICE_NAME:-}"
      # UPDATES_URL_PLATFORM and UPDATES_URL_HOSTED are deliberately NOT listed.
      # Their code defaults are the public raw release-notes URLs, and setting
      # either to "" is the supported way to fall back to the copy EMBEDDED in
      # the image - which is what an air-gapped install wants, and which listing
      # them here with any shell default would take away.
      # Set them directly on the service if you need to point them elsewhere.
      #
      # RELEASE_ENFORCE_MIN_VERSION is likewise unlisted. It defaults to on, and
      # "false" is the break-glass that stops Core refusing nodes which missed a
      # mandatory-update deadline. Set it on the service, deliberately.
    # Core's shutdown runs a sequence, and the whole of it has to fit inside
    # this window or the later steps simply never execute. Budget: the API
    # listener drains for up to 30s, the tab-proxy listener for up to another
    # 30s, node gRPC streams for up to 10s, and only then does Core cancel its
    # background loops, DELETE its heartbeat key and RELEASE the leader lease.
    # Docker's default is 10s, which cut it off before the first step finished:
    # the heartbeat and the lease were then left to expire on their own 30s
    # TTLs on every single deploy, which is exactly what deleting them early
    # was meant to avoid.
    #
    # Draining the API listener really does take the full 30s whenever a panel
    # tab is open: Shutdown waits for active connections and an SSE stream on
    # /api/system/events stays active until its client goes away. Expect a
    # rolling deploy to hold the outgoing task for that long. With start-first
    # the replacement is already serving, so this is a lingering task, not
    # downtime.
    stop_grace_period: 90s
    ports:
      - "25500:25500"   # REST API
      - "25501:25501"   # gRPC node mesh (Cluster-Sync)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:25500/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dylaris_net
    volumes:
      # Core writes library, ticket-attachments, ticket-backups here. Without a
      # volume this data is lost on container recreation. NOTE: this is a LOCAL
      # per-host volume. It is correct for this single-Core compose file; the
      # multi-replica Swarm topology in docker-stack.yml needs S3 or a shared
      # filesystem instead, and that file carries the mount recipe. Core
      # refuses to save the panel's filesystem backend while more than one
      # Core is online.
      - core_data:/app/dylaris_data

  node:
    image: ghcr.io/dylaris-dev/platform-node:latest
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ID: "${NODE_ID:-node-01}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      NODE_TAGS: "${NODE_TAGS:-}"
      NODE_REGION: "${NODE_REGION:-}"
      REDIS_ADDR: "redis:6379"
      # Redis-ACL bootstrap (mandatory -- no open-Redis fallback). CORE_GRPC_ADDR
      # is Core's gRPC mesh port on the same Docker network (DYLARIS_GRPC_PORT,
      # default 25501). NODE_ENROLL_TOKEN is the single-use first-boot token,
      # generated in the panel; a node with an already-cached secret starts
      # without it.
      #
      # There is no NODE_RECOVERY_TOKEN any more. A node whose secret and Core's
      # have diverged keeps dialling and appears under Settings -> Nodes ->
      # Connection attempts, where an operator admits it. Nothing is set here to
      # bring a node back.
      CORE_GRPC_ADDR: "core:25501"
      NODE_ENROLL_TOKEN: "${NODE_ENROLL_TOKEN:-}"
      # The machine's own name, shown next to a refused connection so an
      # operator can tell which host is knocking. Plain Docker gives the
      # container a useful hostname already, so the node's own os.Hostname() is
      # the fallback and this is only needed under Swarm - see docker-stack.yml.
      NODE_HOSTNAME: "${NODE_HOSTNAME:-}"
      PORT_RANGE: "${PORT_RANGE:-25600-25699}"
      # Comma-separated hosts the Node may download Core-minted pack mrpacks
      # from, e.g. app.example.com
      MODPACK_MIRROR_HOSTS: "${MODPACK_MIRROR_HOSTS:-}"
      # Same reason as the core block above: forwarded so .env actually reaches
      # the container. GRPC_TLS_ENABLED must match Core's setting exactly.
      GRPC_TLS_ENABLED: "${GRPC_TLS_ENABLED:-true}"
      GRPC_TLS_FINGERPRINT: "${GRPC_TLS_FINGERPRINT:-}"
      NODE_EXTERNAL: "${NODE_EXTERNAL:-}"
      # MC containers are host siblings and cannot resolve Docker service DNS in
      # every topology, so they may need Redis by IP rather than by name.
      SIDECAR_REDIS_ADDR: "${SIDECAR_REDIS_ADDR:-}"
      SIDECAR_REDIS_DB: "${SIDECAR_REDIS_DB:-}"
      STORAGE_PATHS: "${STORAGE_PATHS:-}"
      DYLARIS_CPUSET_CPUS: "${DYLARIS_CPUSET_CPUS:-}"
      # Beam ticket secret. Core signs beam tickets with JWT_SECRET; the node
      # validates them (node/main.go StartBeamServer). Must equal Core's JWT_SECRET
      # or EVERY beam transfer is rejected - including the 25523 LAN fast-path
      # published below. Wired to JWT_SECRET so the two cannot silently diverge.
      BEAM_JWT_SECRET: "${JWT_SECRET}"
    volumes:
      # The Node drives the host Docker daemon to launch MC server containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - dylaris_data:/app/dylaris_data
    # The Node launches MC server containers as SIBLINGS on the host Docker daemon
    # (via the mounted docker.sock); in direct-port mode each MC container binds
    # its OWN host port from the 25600-25699 range (0.0.0.0:<port>). The range must
    # therefore NOT be re-published on the Node container: doing so grabs the whole
    # range for the Node, and every MC container's bind then fails with
    # "port is already allocated" (routing_mode=gateway publishes no host port at
    # all). Only the Node's own service ports are published here.
    ports:
      - "25520:25520"   # SFTP (when file access = sftp/both)
      # Beam LAN fast-path: the node's pinned-TLS, fingerprint-verified beam port.
      # Published here (self-host / BYON only) so a co-located Beam Desktop client on
      # this LAN can take the direct fast path - now even when a gateway/relay is
      # present (the client tries LAN first, then falls back to the relay). Leaving it
      # unpublished simply falls back to relay/public. NOTE: a NAT'd node still needs a
      # router port-forward for 25523, or a gateway - direct connect cannot traverse
      # NAT. Never publish the plain overlay port 25521.
      - "25523:25523"   # Beam LAN fast-path (TLS, fingerprint-pinned)
    networks:
      - dylaris_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the container shell expands
      # POSTGRES_USER/DB from its own environment.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dylaris_net

  redis:
    # Valkey - a drop-in, Redis-compatible fork. Service name stays "redis"
    # so REDIS_ADDR=redis:6379 works everywhere. In-memory only (coordination
    # bus, not the source of truth - Postgres is).
    # Redis ACL is mandatory. This runs the STOCK image (no custom entrypoint),
    # so Valkey drops to its non-root `valkey` user (the stock entrypoint chowns
    # /data and execs the server via setpriv). --aclfile refuses to start against
    # a missing file, so create the admin `default` user ONCE before the first
    # boot. Dev is passwordless:
    #   mkdir -p valkey-acl && printf 'user default on nopass ~* &* +@all\n' > valkey-acl/users.acl
    # PRODUCTION: seed it with a real password equal to Core's REDIS_PASSWORD
    # (see .env.example / README). Core then connects as the `default` admin and
    # provisions the per-node scoped users. The aclfile lives in /data (the
    # WORKDIR) so the stock chown reaches it and ACL SAVE (temp-file + rename)
    # works as non-root. valkey-acl/ is git-ignored (runtime state, not source).
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # maxmemory + volatile-lru is a backstop for the metadata caches, which are
    # the only thing here that grows with USE rather than with fleet size (one
    # Modrinth version list measures 290 KB to 1.2 MB). Two properties matter:
    #   volatile-*  evicts only keys that carry a TTL, and the node command
    #               streams, the consumer groups and the ACL users carry none,
    #               so the control plane is not evictable at all.
    #   *-lru       goes for the least recently touched, which is a stale cache
    #               entry rather than a live server status. volatile-ttl would
    #               do the opposite: it drops the shortest TTL first, and that
    #               is the 30s status, not the 1h cache.
    # Without a limit the default is noeviction, where a full instance starts
    # REFUSING writes - and one of those writes is queueing a node command.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--aclfile", "/data/users.acl", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - ./valkey-acl:/data
    networks:
      - dylaris_net

volumes:
  timescaledb_data:
  dylaris_data:
  core_data:

networks:
  dylaris_net:
    driver: bridge
