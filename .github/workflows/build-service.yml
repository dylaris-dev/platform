name: Build Service (Reusable)

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      entry_path:
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: "./Dockerfile"
      context:
        required: false
        type: string
        default: "."
      extra_build_args:
        required: false
        type: string
        default: ""
      release_version:
        description: >-
          The release this image is built from, stamped into the binary so the
          component can report its OWN position rather than being assumed to have
          moved whenever Core did. Computed once in detect-changes with the same
          parser Core uses, so the stamp cannot disagree with the file.

          Empty is legitimate and means "no releases yet": the component then
          reports nothing, which is honest. It must never be given a placeholder,
          because a component claiming a version it does not have is worse than
          one claiming none.
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dylaris-dev/platform
  # build-push-action v6 generates a build summary and uploads a build RECORD
  # artifact for every build. On this runner that is four to six extra artifact
  # uploads per run for a page nobody opens, on a workflow whose whole problem
  # today was time spent moving bytes around. The builds themselves are
  # unaffected.
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Give this job its own Docker credential store, before anything logs in.
      #
      # The runner is self-hosted and runs jobs concurrently, so every job on it
      # otherwise shares one ~/.docker/config.json. docker/login-action writes
      # the job's GITHUB_TOKEN there, and that token is revoked the moment ITS
      # job finishes - so a neighbouring build that logged in later, or an
      # earlier one that has since ended, decides what credential is on disk
      # when this job pushes. The symptom is a push that fails with
      #
      #   denied: permission_denied ... 403 Forbidden
      #   failed to authorize: failed to fetch oauth token ... 403 Forbidden
      #
      # on a run whose tests all passed, and that succeeds on a rerun because
      # the rerun is alone on the machine. Seen twice in one afternoon of rapid
      # pushes, both times while other runs were in flight, both times only on
      # the reusable-workflow builds - never on build-core, which happens to be
      # first in the queue.
      #
      # This is the failure mode the evidence fits; it is not proven root cause.
      # It costs nothing if the real cause is elsewhere, and it removes a shared
      # mutable file two jobs can both write, which is worth doing regardless.
      #
      # Set here rather than in a job-level env: block because the runner
      # context is only available inside steps.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-${{ inputs.component }}"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"


      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ inputs.component }}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up a buildx builder
        # Its own BuildKit container, not the host daemon's image store. With the
        # default docker driver a build re-tagged :latest in the runner host's
        # store, and on a host that also runs a BYON node that image vanished from
        # under the running node (containerd store): watchtower then skipped the
        # node on every pass and it never updated again.
        # One named builder per host, kept between jobs, so the BuildKit cache
        # survives the way the daemon's cache did; the action reuses a builder
        # that already exists under this name.
        uses: docker/setup-buildx-action@v4
        with:
          name: dylaris-ci
          cleanup: false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.tags.outputs.IMAGE }}:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ steps.tags.outputs.IMAGE }}:${{ steps.tags.outputs.TAG_SHA }}
          build-args: |
            ${{ inputs.entry_path != '' && format('ENTRY_PATH={0}', inputs.entry_path) || '' }}
            RELEASE_VERSION=${{ inputs.release_version }}
            NEXT_PUBLIC_RELEASE_VERSION=${{ inputs.release_version }}
            ${{ inputs.extra_build_args }}
