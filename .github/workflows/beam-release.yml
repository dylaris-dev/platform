name: Beam Release

on:
  push:
    tags:
      - 'beam-v*'

permissions:
  contents: write

jobs:
  build-beam:
    # ONE Linux job cross-builds BOTH linux/amd64 and windows/amd64. Wails renders
    # Windows via the pure-Go go-webview2 loader (no CGO) and embeds the icon /
    # manifest via a pure-Go .syso, so GOOS=windows GOARCH=amd64 cross-compiles
    # from Linux with the stock toolchain - no windows-latest runner needed for the
    # .exe. Runs on a GitHub-hosted ubuntu-22.04 (NOT a self-hosted runner and NOT
    # ubuntu-latest): the Linux build needs the GTK3 + WebKit2GTK 4.0 dev headers,
    # which we apt-install below and which 22.04 still ships (24.04 dropped 4.0).
    # macOS still needs its own runner; when that lands, convert this into a matrix.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Wails Linux build deps
        # GTK3 + WebKit2GTK 4.0 for the linux/amd64 webview build. The Windows
        # cross-build itself is pure-Go and needs none of these.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Derive version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#beam-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: beam/app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: beam/app/frontend/package-lock.json

      - name: Stamp version into wails.json
        working-directory: beam/app
        run: |
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${{ steps.ver.outputs.VERSION }}\"/" wails.json

      - name: Build beam (linux/amd64)
        working-directory: beam/app
        # Uses the vendored + BC3-patched Wails CLI via the module replace (no
        # separate wails install). AppVersion is injected for the updater. A FORK
        # rebrands its default targets here by appending to -ldflags, no source
        # change: -X main.defaultPanelURL=... -X main.defaultAPIURL=...
        # -X main.updateRepoURL=https://github.com/<owner>/<repo> (see main.go /
        # updater.go). The stock build keeps the official Dylaris defaults.
        run: go run github.com/wailsapp/wails/v2/cmd/wails build -platform linux/amd64 -ldflags "-X main.AppVersion=${{ steps.ver.outputs.VERSION }}"

      - name: Build beam (windows/amd64 cross)
        working-directory: beam/app
        # Cross-compile the Windows binary from Linux (no CGO). Single target, so
        # Wails names it build/bin/DylarisBeam.exe (no arch suffix). -skipbindings
        # is REQUIRED cross-building from Linux: Wails would otherwise compile the
        # bindings generator FOR windows and try to run that .exe on the Linux
        # runner ("not a valid CIL image"). The linux/amd64 build above already
        # generated the (platform-agnostic) frontend bindings, so reuse them.
        run: go run github.com/wailsapp/wails/v2/cmd/wails build -platform windows/amd64 -skipbindings -ldflags "-X main.AppVersion=${{ steps.ver.outputs.VERSION }}"

      - name: Read the force-update floor
        id: floor
        working-directory: beam/app
        # The floor lives in MIN_VERSION, committed beside the app, because it is a
        # property of the release rather than an operator setting - Core removed its
        # hand-typed second opinion for exactly that reason. Without this step the
        # -min-version flag had no caller at all: every published manifest omitted
        # minVersion, so the force-update gate Core advertises and the app enforces
        # could never fire, on any release. Empty is the normal case and reproduces
        # the old manifest byte for byte.
        run: echo "MIN=$(sed -n 's/^MIN_VERSION=//p' MIN_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Stage + sign release assets
        working-directory: beam/app
        env:
          BEAM_UPDATE_PRIVKEY: ${{ secrets.BEAM_UPDATE_PRIVKEY }}
        run: |
          mkdir -p dist-release
          cp build/bin/DylarisBeam dist-release/DylarisBeam-linux-amd64
          # Windows ships as a SINGLE .exe: the human double-click artifact AND the
          # updater target. beam-release sign derives the manifest URL WITH the .exe
          # extension (assetName), so the signed + published bytes are one file - no
          # byte-identical extensionless duplicate.
          cp build/bin/DylarisBeam.exe dist-release/DylarisBeam-windows-amd64.exe
          go run ./cmd/beam-release sign \
            -version "${{ steps.ver.outputs.VERSION }}" \
            -min-version "${{ steps.floor.outputs.MIN }}" \
            -base-url "https://github.com/Bartis-Dev/dylaris-platform/releases/latest/download" \
            -out dist-release \
            linux-amd64=dist-release/DylarisBeam-linux-amd64 \
            windows-amd64=dist-release/DylarisBeam-windows-amd64.exe

      - name: Sign dev-channel manifest (beam-dev)
        # Only for -dev prereleases. The dev channel reads a FIXED manifest URL,
        # releases/download/beam-dev/latest.json, so its manifest must point its
        # binary URLs at the moving beam-dev release (NOT releases/latest/download,
        # which always resolves to the newest STABLE release). Same binaries, same
        # signing key - only the base-url differs, so the manifest is re-signed.
        if: contains(github.ref_name, '-dev')
        working-directory: beam/app
        env:
          BEAM_UPDATE_PRIVKEY: ${{ secrets.BEAM_UPDATE_PRIVKEY }}
        run: |
          mkdir -p dist-dev
          cp dist-release/DylarisBeam-linux-amd64 dist-dev/
          cp dist-release/DylarisBeam-windows-amd64.exe dist-dev/
          go run ./cmd/beam-release sign \
            -version "${{ steps.ver.outputs.VERSION }}" \
            -min-version "${{ steps.floor.outputs.MIN }}" \
            -base-url "https://github.com/Bartis-Dev/dylaris-platform/releases/download/beam-dev" \
            -out dist-dev \
            linux-amd64=dist-dev/DylarisBeam-linux-amd64 \
            windows-amd64=dist-dev/DylarisBeam-windows-amd64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Beam ${{ steps.ver.outputs.VERSION }}
          # A beam-v*-dev tag publishes as a GitHub prerelease so it stays OUT of
          # the releases/latest pointer (the stable channel). Only full x.y.z
          # tags become "latest"; the dev channel reads prereleases separately.
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          files: |
            beam/app/dist-release/DylarisBeam-linux-amd64
            beam/app/dist-release/DylarisBeam-linux-amd64.sig
            beam/app/dist-release/DylarisBeam-windows-amd64.exe
            beam/app/dist-release/DylarisBeam-windows-amd64.exe.sig
            beam/app/dist-release/latest.json
            beam/app/dist-release/latest.json.sig

      - name: Publish/refresh dev channel (beam-dev moving prerelease)
        # -dev builds only: overwrite the assets on the fixed "beam-dev" prerelease
        # so releases/download/beam-dev/latest.json always serves the newest dev
        # build. make_latest:false keeps beam-dev out of the "Latest release"
        # pointer (that must stay the stable release). The tag ref may lag on an
        # older commit; only the assets matter for the download URL.
        if: contains(github.ref_name, '-dev')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beam-dev
          name: Beam Dev Channel
          prerelease: true
          make_latest: false
          files: |
            beam/app/dist-dev/DylarisBeam-linux-amd64
            beam/app/dist-dev/DylarisBeam-linux-amd64.sig
            beam/app/dist-dev/DylarisBeam-windows-amd64.exe
            beam/app/dist-dev/DylarisBeam-windows-amd64.exe.sig
            beam/app/dist-dev/latest.json
            beam/app/dist-dev/latest.json.sig
