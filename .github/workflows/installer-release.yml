name: Installer release

# One release, always the newest installer: tag installer-latest with
# install.sh, install.ps1 and SHA256SUMS, replaced on every change. There are
# no version numbers; the published install.sh carries the date and commit it
# was built from (install.sh --version), so a support question can still say
# which one ran.
#
# Never marked as the repository's latest release: the Beam client's stable
# channel reads releases/latest.

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/installer-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: docker run --rm -v "$PWD/installer:/mnt" koalaman/shellcheck:stable -S warning install.sh

      - name: Stamp and check
        run: |
          STAMP="$(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))"
          sed -i "s/^INSTALLER_VERSION=\"dev\"$/INSTALLER_VERSION=\"$STAMP\"/" installer/install.sh
          grep -q "^INSTALLER_VERSION=\"$STAMP\"$" installer/install.sh
          bash -n installer/install.sh
          bash installer/install.sh --version
          bash installer/install.sh --help >/dev/null
          cd installer && sha256sum install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installer
          gh release delete installer-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create installer-latest install.sh install.ps1 SHA256SUMS \
            --title "Installer" \
            --notes "The DYLARIS platform installer, always the newest. See the README, section Installer." \
            --latest=false --target "$GITHUB_SHA"
