name: CI

# One workflow, one run per push. Order of operations:
#   1. Run the FULL test suite first (every Go module + the panel).
#   2. Only if everything is green, run change detection.
#   3. Build and push the images whose paths changed.
# On pull_request only the tests run (no image build/push). A manual
# workflow_dispatch runs the tests and then builds EVERY image (full rebuild),
# regardless of what changed.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# One run of this workflow at a time, per ref. QUEUED, not cancelled.
#
# This runner is a single shared machine, and the workflow's cost is disk and CPU
# rather than wall-clock waiting: two runs at once do not finish in the time of
# one, they thrash. Measured - a push and a manual dispatch five seconds apart on
# the same commit put sixteen jobs on one runner and pushed db-tests back over
# ten minutes, undoing the cache fix that had just taken the whole workflow from
# 20 minutes to 5.
#
# cancel-in-progress stays FALSE deliberately, even though cancelling is the
# usual reflex. This workflow BUILDS AND PUSHES IMAGES, and change detection is
# per-service: if a push that touches core were cancelled by a later push that
# touches only the panel, core's image would simply never be built, and nothing
# would say so. Queueing costs a wait; cancelling costs a missing deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dylaris-dev/platform
  # build-push-action v6 generates a build summary and uploads a build RECORD
  # artifact for every build. On this runner that is four to six extra artifact
  # uploads per run for a page nobody opens, on a workflow whose whole problem
  # today was time spent moving bytes around. The builds themselves are
  # unaffected.
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  # ----------------------------------------------
  # 1. Tests - always run first, for every module.
  # ----------------------------------------------
  go-tests:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [core, node, pkg, log-shipper, beam/app]
    steps:
      - uses: actions/checkout@v5

      # cache: false is DELIBERATE and was measured, not assumed.
      #
      # setup-go's cache covers GOMODCACHE *and* GOCACHE, which in this tree is
      # a 641 MB archive. Restoring it on run 33172390134 took SEVEN MINUTES AND
      # SIXTEEN SECONDS - not the download, which finished in 77s, but the
      # `tar -xf` afterwards. Five matrix jobs do it at once on one disk, so
      # they also queue behind each other. The log-shipper job spent 8m35s in
      # "Set up Go" and 34 SECONDS on everything else, tests included.
      #
      # This runner is long-lived rather than fresh-per-job: setup-go reports
      # "Found in cache @ /opt/hostedtoolcache/go/1.26.7/x64", i.e. the toolchain
      # was already extracted from a previous run. GOMODCACHE and GOCACHE live on
      # the same machine, so the restore was overwriting files that were already
      # there.
      #
      # MEASURED, not assumed: run 33174274653 printed
      # "GOMODCACHE /root/go/pkg/mod: 614M" on a job with cache: false, so the
      # modules were already on the machine and the restore had been overwriting
      # correct files. The probe that proved it was then removed - `du -sh` over
      # 614 MB costs 55s on this disk, five times per run. To re-check after a
      # runner change: `du -sh $(go env GOMODCACHE)`.
      #
      # Result across the whole workflow: 20 minutes to 5.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false

      # beam/app embeds frontend/dist (a Wails build artifact that a fresh
      # checkout does not have, so `go build` fails on the //go:embed). The Go
      # tests use fakes and never read the real bundle, so a one-file stub is
      # enough to satisfy the embed and compile. The real frontend is built for
      # release in beam-release.yml.
      - name: Stub beam frontend bundle
        if: matrix.module == 'beam/app'
        working-directory: ${{ matrix.module }}
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>stub</title>' > frontend/dist/index.html

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # gofmt gate. Formatting drifts on its own: 38 files across four modules
      # had drifted before this existed, because build, vet, test and
      # staticcheck all pass happily on unformatted code and nothing else was
      # looking.
      #
      # -l lists files differing from gofmt's output; a non-empty list fails the
      # job and prints the diff, so the fix is one `gofmt -w` away. The vendored
      # Wails tree is excluded - it is a third-party snapshot carried on purpose
      # (beam/app/VENDOR.md) and is not ours to reformat.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            gofmt -d $unformatted
            exit 1
          fi

      # staticcheck correctness gate (pinned). Runs the SA (correctness) checks
      # plus U1000; the ST/S1/QF style families are intentionally not enforced.
      #
      # U1000 (unused) is here because dead code is not a style question in this
      # tree - it is how a feature silently fails to exist. customDomainDeadlineHint
      # was written to be the one place two route handlers agreed on what they
      # promised the customer, and had NO caller, so neither handler promised
      # anything and a route on an unproven domain vanished four hours later with
      # no warning. Nothing failed; the code was simply never reached. Deliberate
      # exceptions take //lint:ignore U1000 with a reason, which is the point.
      #
      # Three SA checks are excluded as pre-existing, deliberately-deferred
      # findings so the gate stays green and meaningful for NEW code:
      #   SA1019 - deprecated APIs still in use (go-redis SetNX, aws uploader,
      #            tar.TypeRegA); tracked, not a correctness bug.
      #   SA1029 - built-in string context keys; a codebase-wide pattern set by
      #            the auth middleware, a broad refactor tracked separately.
      #   SA9003 - two pre-existing empty branches in handlers/tickets.go.
      # `go run ...@version` pins the tool and does not modify go.mod/go.sum.
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks 'SA*,U1000,-SA1019,-SA1029,-SA9003' ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

      # Reachability-based vulnerability gate.
      #
      # This is the check that catches what Dependabot structurally cannot.
      # Dependabot reads manifests; the Go toolchain is pinned in this workflow
      # and in the Dockerfiles, so it sat on 1.26.1 with standard-library
      # vulnerabilities reachable from every service's own code and nothing
      # said a word. govulncheck traces from this module's code to the
      # vulnerable SYMBOL, so it also does not cry about a dependency whose
      # vulnerable function nobody here calls.
      #
      # Exit 3 is "vulnerabilities found", which is data, not a tool failure -
      # the gate below decides what it means. Any other non-zero exit IS a tool
      # failure and stops the job, because a scanner that silently did not run
      # is worse than no scanner.
      #
      # A note for the day this fires on beam/app: its Wails is VENDORED and
      # security-patched on purpose (beam/app/VENDOR.md), so the answer there is
      # to patch the vendored tree, never to bump it to a stock release.
      #
      # See .github/vulngate.awk for the fail-vs-report rule.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          # setup-go installs a problem matcher for "file.go:line:col: message",
          # and govulncheck's call traces look exactly like that. Ten
          # informational lines ("X calls Y", the evidence for a finding the
          # gate below deliberately does NOT fail on) were therefore posted as
          # ten ERRORS on a job that passed - which is how a green run learns to
          # look broken. Removed for the rest of this job, which is only this
          # step: go build, staticcheck and go test all ran before it, and there
          # an annotation is exactly right.
          echo "::remove-matcher owner=go::"

          # Installed rather than `go run ...@version` like staticcheck above,
          # and that is not a style choice: `go run` reports the tool's exit
          # status as its own 1, so "found vulnerabilities" (3) and "the scanner
          # broke" would arrive identical here. Running the binary keeps them
          # apart, which is the whole basis of the check below.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          code=0
          "$(go env GOPATH)/bin/govulncheck" ./... > "$RUNNER_TEMP/vulns.txt" || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            cat "$RUNNER_TEMP/vulns.txt"
            echo "govulncheck itself failed (exit $code)"
            exit "$code"
          fi
          cat "$RUNNER_TEMP/vulns.txt"
          echo "--- reachability gate ---"
          awk -f "$GITHUB_WORKSPACE/.github/vulngate.awk" "$RUNNER_TEMP/vulns.txt"

  # Race detector gate. Separate from go-tests because it needs a C toolchain
  # that the plain matrix does not: -race requires cgo, and cgo requires gcc,
  # which is not installed on this runner and is not ours to add.
  #
  # Runs as a docker BUILD, which uploads its context instead of mounting one.
  # That is the same code path the image-build jobs below have always used
  # successfully here, so it does not depend on how the runner itself is
  # packaged. Two simpler mechanisms were tried first and both failed for
  # environment reasons; .github/race.Dockerfile records what they were so
  # nobody spends the afternoon rediscovering them.
  #
  # Covers EVERY Go module. It started core-only ON PURPOSE, because a NEW gate
  # that retroactively fails on untouched code blocks deploys for reasons nobody
  # chose that day, and the rule was to extend it per module only once that
  # module had been read by hand. All four others were checked on 2026-08-02/03:
  # the checks found two races in node and a dead-letter data-loss path in pkg
  # (all fixed and covered before the gate moved), and found log-shipper and
  # beam/app already correct. The rule has now been applied everywhere, so a new
  # module is the only thing that should ever need adding here again.
  #
  # See .github/race.Dockerfile for what a green run here does and does not prove.
  race-tests:
    runs-on: self-hosted
    # A ceiling, not a target: this normally finishes in well under ten
    # minutes. It exists because the concurrency queue added on 2026-08-28
    # makes a stuck run block every later one, and GitHub's own default is
    # six HOURS. Set far above any legitimate run - the two repos share one
    # machine, so a slow run under cross-repo contention must not go red.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # BUILDKIT_PROGRESS=plain so the test output lands in the job log. Without
      # it buildx collapses the RUN and a PASSING run tells you nothing about
      # what actually ran; a gate you cannot read is a gate you stop trusting.
      - name: go test -race (all Go modules)
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./.github/race.Dockerfile
          push: false
          # Nothing consumes the resulting image - the RUN steps ARE the gate, and
          # a failing one fails the build. Exporting it anyway cost 79.8s of
          # "exporting layers" plus an attestation manifest on run 33170299856,
          # for an artifact that is discarded in the same breath. cacheonly keeps
          # the layer cache (so an unchanged go.sum still skips the download) and
          # skips materialising the image.
          outputs: type=cacheonly
          provenance: false

  # Postgres integration gate. Every other test in this repo runs against fakes,
  # which is exactly why a run of SQL defects shipped unnoticed: the statements
  # were only ever rejected by a real Postgres.
  #
  #   ticket status / user role   inconsistent types deduced for parameter $1
  #   ticket_messages.user_id     NOT NULL with ON DELETE SET NULL -> 23502
  #   backup_jobs.*_patterns      nil slice into a NOT NULL text[] -> 23502
  #   spark_profiles.requested_by UUID scanned into an integer target
  #   modversions.modrinth_download_url  missing on every fresh install
  #
  # NOT a `services:` block, and not for want of trying: two runs proved one
  # does start a healthy Postgres here and that the job still cannot reach it,
  # over localhost and 127.0.0.1 alike. THIS RUNNER IS ITSELF CONTAINERIZED
  # (race.Dockerfile records the same fact), so `-p` publishes on the host
  # daemon, outside the runner's network namespace. Two containers on one
  # user-defined network reach each other by NAME instead, which needs neither.
  #
  # See .github/db.Dockerfile for why the tests are baked into an image rather
  # than mounted, and why they run as `docker run` rather than as a build step.
  #
  # It gates the builds like every other test job. It was deliberately kept out
  # of `needs:` until it had been green once - a new gate that fails for
  # environment reasons blocks deploys for reasons nobody chose that day, which
  # is the rule the race-tests comment above records. That happened on run
  # 31158973711: 6/6 against a real Postgres, 357 statements prepared.
  db-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: go test against a real Postgres
        run: |
          set -eu
          NET="dyl-dbtest-${{ github.run_id }}"
          PG="dyl-pg-${{ github.run_id }}"
          IMG="dyl-dbtest:${{ github.run_id }}"

          cleanup() {
            docker rm -f "$PG" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
            docker image rm -f "$IMG" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET"
          docker run -d --name "$PG" --network "$NET"             -e POSTGRES_USER=dylaris -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=dylaris_test             --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20             postgres:16-alpine

          # Wait on the container's own healthcheck. Bounded at ~90s: the image
          # is small and already local, so anything slower is a real failure and
          # should say so quickly rather than let InitDB retry for minutes.
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG")" = healthy ] && break
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG")" != healthy ]; then
            echo "::error::postgres never became healthy"
            docker logs "$PG" | tail -30
            exit 1
          fi

          docker build -f .github/db.Dockerfile -t "$IMG" .

          # DYLARIS_TEST_DB_HOST is also the switch that turns the suite on: it
          # skips itself when unset, so `go test ./...` stays green anywhere
          # without a database.
          docker run --rm --network "$NET"             -e DYLARIS_TEST_DB_HOST="$PG"             -e DYLARIS_TEST_DB_PORT=5432             -e DYLARIS_TEST_DB_USER=dylaris             -e DYLARIS_TEST_DB_PASSWORD=testpw             -e DYLARIS_TEST_DB_NAME=dylaris_test             "$IMG"

  panel-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # This is an npm workspaces monorepo (root package.json declares
      # "workspaces": ["packages/*", "panel"]) and the lockfile lives at the
      # repo root, not panel/package-lock.json. `npm ci` is intentionally not
      # used here: the lockfile was generated on Windows and misses the
      # platform-specific optional native binaries (lightningcss/swc) for other
      # OS/libc targets, so it does a plain
      # `npm install --workspaces --include-workspace-root` instead. The root
      # Dockerfile's panel-build stage says the same and does the same.
      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Run vitest
        working-directory: panel
        run: npx vitest run

  # ----------------------------------------------
  # 2. Change detection - only after every test job is green, and never on PRs.
  # ----------------------------------------------
  detect-changes:
    needs: [go-tests, race-tests, panel-tests, db-tests]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    outputs:
      core: ${{ steps.filter.outputs.core }}
      node: ${{ steps.filter.outputs.node }}
      log-shipper: ${{ steps.filter.outputs.log-shipper }}
      version: ${{ steps.rel.outputs.VERSION }}
      notes: ${{ steps.filter.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release check below reads the PREVIOUS commit's notes, to tell a
          # new release from an edit to one that already shipped.
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version-file: pkg/go.mod
          # See the go-tests job: this runner is long-lived and already holds
          # the module and build caches, so restoring them costs minutes and
          # buys nothing.
          cache: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The root Dockerfile builds ALL THREE Go images AND the panel
          # bundle inside the Core one, so a change to it has to rebuild all
          # three. It was watched by nothing: the Go
          # toolchain bump that fixed reachable standard-library CVEs reached
          # only the core image, because a file under core/ happened to change
          # in the same push. node and log-shipper kept shipping the old
          # toolchain with nothing to say so.
          filters: |
            core:
              - 'core/**'
              - 'proto/**'
              - 'pkg/**'
              - 'Dockerfile'
              # The panel is compiled INTO the Core image, so a panel-only change
              # has to rebuild Core or it never ships. There is no panel image to
              # build any more.
              - 'panel/**'
              - 'packages/**'
            node:
              - 'node/**'
              - 'proto/**'
              - 'pkg/**'
              - 'Dockerfile'
            log-shipper:
              - 'log-shipper/**'
              - 'docker/mc-server/**'
              - 'Dockerfile'
            # The two release-notes files BY NAME, not core/updates/*.md.
            # That glob also matched README.md, which is documentation ABOUT the
            # notes - and this output arms the announcement. On 2026-08-28 a push
            # that edited only that README announced release 2026.08.28 to
            # Discord and claimed both git tags, so the release could never be
            # announced again. It went out with no role ping, because the role
            # secrets were added forty minutes later.
            notes:
              - 'core/updates/platform.md'
              - 'core/updates/hosted.md'

      # Validate the release notes and read the version every image is stamped
      # with. One reader, shared with Core, so the stamp cannot disagree with
      # the file. A malformed file fails HERE rather than shipping as an
      # announcement nobody can parse.
      - name: Validate the release notes
        id: rel
        run: |
          cd pkg
          go run ./cmd/relnotes validate ../core/updates/platform.md ../core/updates/hosted.md
          V=$(go run ./cmd/relnotes version ../core/updates/platform.md ../core/updates/hosted.md)
          echo "VERSION=${V}" >> $GITHUB_OUTPUT
          echo "Release version: ${V:-none}"

      # The failure mode one-version-per-repo introduces, closed.
      #
      # Only services whose files changed get rebuilt. If a release block names
      # `core` and this run does not build core, core's stamped version can never
      # reach that block - so the panel shows core as behind FOREVER, and nothing
      # anywhere fails. A silent permanent-orange is worth a red pipeline.
      #
      # What must be built is what this push NEWLY claims, which is not the same
      # as what the top block names. A release is cut once and then its wording
      # gets edited - a typo, a softened sentence, a corrected file path - and
      # those edits touch core/updates/*.md without touching the panel or the
      # node. Demanding a rebuild of everything the block names would make every
      # such edit red from then on, which is what happened on 2026-08-28: the
      # release had built core, panel and node an hour earlier, and a docs-only
      # push that reworded it failed for naming them.
      #
      # So: an unchanged version means the release was already cut, and only
      # names ADDED since the previous commit need a build in this run. A changed
      # version is a new release, and everything it names must be built here.
      - name: Every service the release names must be built here
        if: steps.filter.outputs.notes == 'true'
        run: |
          VERSION="${{ steps.rel.outputs.VERSION }}"
          NAMES=$(cd pkg && go run ./cmd/relnotes services ../core/updates/platform.md ../core/updates/hosted.md)

          # The previous commit's notes, read with the same parser. Unreadable
          # (first commit, or the file was just added) leaves PREV empty, which
          # requires everything - the safe direction.
          PREV=""
          OLD=$(mktemp -d)
          if git show "HEAD^:core/updates/platform.md" > "$OLD/platform.md" 2>/dev/null              && git show "HEAD^:core/updates/hosted.md" > "$OLD/hosted.md" 2>/dev/null; then
            PREV_VERSION=$(cd pkg && go run ./cmd/relnotes version "$OLD/platform.md" "$OLD/hosted.md" || true)
            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" = "$VERSION" ]; then
              PREV=$(cd pkg && go run ./cmd/relnotes services "$OLD/platform.md" "$OLD/hosted.md" || true)
              echo "Release $VERSION was already cut; only names added since HEAD^ need a build here."
            fi
          fi
          rm -rf "$OLD"

          MISSING=""
          for svc in $NAMES; do
            case " $PREV " in
              *" $svc "*) continue ;;
            esac
            case "$svc" in
              core)        BUILT="${{ steps.filter.outputs.core }}" ;;
              node)        BUILT="${{ steps.filter.outputs.node }}" ;;
              # No panel case: the panel is not a component any more (it is
              # compiled into Core), and release.Services no longer lists it, so
              # a block naming it lands in the warning branch below - which is
              # the right answer, because nothing can ship it.
              log-shipper) BUILT="${{ steps.filter.outputs.log-shipper }}" ;;
              # Gateway components are released from the other repo and are not
              # built here. Naming one in platform.md is a mistake, but it is a
              # mistake about the wrong FILE, which the parser cannot see.
              *) echo "::warning::the release names '$svc', which this repo does not build"; continue ;;
            esac
            [ "$BUILT" = "true" ] || MISSING="$MISSING $svc"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::The new release names$MISSING, but this run does not rebuild"
            echo "$MISSING. Those components could never reach the release that"
            echo "names them, so the panel would show them as behind forever."
            echo "Either the entry names the wrong service, or the change that"
            echo "was supposed to accompany it is missing from this push."
            exit 1
          fi
          echo "Every service this push newly claims is being built."

  # ----------------------------------------------
  # 3. Build + push. Changed images on push; every image on workflow_dispatch.
  # ----------------------------------------------
  build-core:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker credential store; see the same step in
      # build-service.yml for why a shared ~/.docker/config.json on a
      # concurrent self-hosted runner produces a 403 on push.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-core"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Core
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_SHA }}
          build-args: |
            ENTRY_PATH=./core/
            SERVICE=core
            RUN_AS=dylaris
            # Without this the Dockerfile default (panel-none) wins and the
            # image ships WITHOUT the panel - it boots, serves the API, and
            # answers every page with the placeholder. Asserted by
            # TestCIBuildsCoreWithThePanel so it cannot be dropped silently.
            PANEL_STAGE=panel-build
            RELEASE_VERSION=${{ needs.detect-changes.outputs.version }}

  build-node:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-service.yml
    with:
      component: node
      release_version: ${{ needs.detect-changes.outputs.version }}
      entry_path: ./node/
      extra_build_args: "INSTALL_QUOTA=1"
    secrets: inherit

  build-log-shipper:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.log-shipper == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker credential store; see the same step in
      # build-service.yml for why a shared ~/.docker/config.json on a
      # concurrent self-hosted runner produces a 403 on push.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-log-shipper"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          # Same reason as the go-tests job above: restoring that cache costs
          # seven minutes of tar on this runner, and this job sits on the path to
          # a deploy. The tests have already warmed the module cache by the time
          # it runs.
          cache: false

      - name: Build log-shipper binary
        run: |
          chmod +x ./build_shipper.sh
          ./build_shipper.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      # Minecraft 26.1+ refuses to start on anything below Java 25 ("Minecraft
      # 26.1 and newer requires running the server with Java 25 or above"), and
      # the version pickers offer 26.x, so without this image the newest
      # selectable version installs a server that can never boot.
      - name: Build and push java25
        uses: docker/build-push-action@v7
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java25
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java25:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java25:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java21
        uses: docker/build-push-action@v7
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java21
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java17
        uses: docker/build-push-action@v7
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java17
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java8
        uses: docker/build-push-action@v7
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java8
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_SHA }}

  # ----------------------------------------------
  # 4. Announce the release in Discord.
  # ----------------------------------------------
  #
  # One message per audience, because they have no reader in common: platform.md
  # goes to people who RUN the platform, hosted.md to customers who run a node or
  # nothing. Each is announced only when ITS top block is the release being cut.
  #
  # No wait timer and no environment gate: the message goes out as soon as the
  # builds are green. That is a deliberate choice, not an omission - an
  # `environment:` with a timer was tried first and removed, because the delay it
  # buys is only useful to someone watching the run, and the thing it would
  # protect against (announcing a release you did not mean to cut) is already
  # prevented earlier: the announcement only fires when the notes file changed in
  # THIS push and its top block is this version.
  #
  # What stays load-bearing is the git tag below. It is claimed BEFORE the post,
  # so a re-run, a revert or a second push cannot announce the same release
  # twice - and that guarantee never depended on the timer.
  announce:
    needs: [detect-changes, build-core, build-node, build-log-shipper]
    # always() so a SKIPPED build (nothing changed for that service) does not
    # take the announcement with it - but a failed or cancelled one must.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.detect-changes.outputs.notes == 'true'
      && needs.detect-changes.outputs.version != ''
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: pkg/go.mod
          cache: false

      - name: Announce
        env:
          WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          ROLE_PLATFORM: ${{ secrets.DISCORD_ROLE_PLATFORM }}
          ROLE_BYON: ${{ secrets.DISCORD_ROLE_BYON }}
          ROLE_ROUTEONLY: ${{ secrets.DISCORD_ROLE_ROUTEONLY }}
          VERSION: ${{ needs.detect-changes.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "DISCORD_UPDATES_WEBHOOK is not set; nothing to announce to."
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/blob/main/core/updates"

          announce_one() {
            file="$1"; title="$2"; roles="$3"; tag="$4"

            # Only announce a file whose OWN top block is this release. A release
            # that changed nothing for this audience has an older top block, and
            # re-posting it would be the same message twice.
            have=$(cd pkg && go run ./cmd/relnotes version "../core/updates/${file}")
            if [ "$have" != "${VERSION}" ]; then
              echo "${file} is at ${have:-none}, not ${VERSION}: nothing new for this audience."
              return 0
            fi

            # Claim the release BEFORE posting. Pushing a tag fails if it already
            # exists, which makes this an atomic compare-and-set and the only
            # state this needs. Claim-then-post is the deliberate order: a failed
            # webhook after a successful tag is a missing message, which is
            # visible and can be sent by hand. Post-then-tag risks announcing
            # twice, and an unsent message is recoverable where a duplicate is
            # not.
            if ! git push origin "HEAD:refs/tags/${tag}" 2>/dev/null; then
              echo "${tag} already exists: this release has been announced."
              return 0
            fi

            (cd pkg && go run ./cmd/relnotes discord               -title "${title}" -role "${roles}" -url "${BASE}/${file}"               "../core/updates/${file}") > /tmp/discord-${tag}.json

            code=$(curl -sS -o /tmp/discord-resp.txt -w '%{http_code}'               -X POST -H 'Content-Type: application/json'               --data @/tmp/discord-${tag}.json "${WEBHOOK}")
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              echo "::error::Discord refused the ${title} announcement (HTTP $code)"
              cat /tmp/discord-resp.txt
              exit 1
            fi
            echo "Announced ${title} ${VERSION}."
          }

          announce_one platform.md Platform "${ROLE_PLATFORM}" "platform-${VERSION}"
          announce_one hosted.md  Service  "${ROLE_BYON},${ROLE_ROUTEONLY}" "hosted-${VERSION}"
